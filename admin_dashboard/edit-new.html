          <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Edit News</h1>

            <div class="card shadow mb-4">
              <div class="card-body">
                <form id="editNewsForm" enctype="multipart/form-data">
                  <input type="hidden" name="news_id" value>

                  <div class="form-group">
                    <label>Title</label>
                    <!-- سنحوّلها إلى news_title عند الإرسال -->
                    <input type="text" name="title" class="form-control"
                      placeholder="News title" required>
                  </div>

                  <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="5" class="form-control"
                      placeholder="News body" required></textarea>
                  </div>

                  <div class="form-group">
                    <label for="newsImageDisplay">Image</label>
                    <img id="newsImageDisplay" src alt="News image"
                      style="max-width:300px;height:auto;border:1px solid #ddd;margin-top:10px;display:block;">
                  </div>

                  <div class="form-group">
                    <label>Upload New Image</label>
                    <!-- يجب أن يكون الاسم photo ليتوافق مع الباك -->
                    <input type="file" name="photo" class="form-control-file"
                      accept="image/*">
                  </div>

                  <button type="button" class="btn btn-primary"
                    onclick="handleNewsUpdate()">Update News</button>
                </form>
              </div>
            </div>
          </div>

          <footer class="sticky-footer bg-white">

    <!-- Modals & scripts -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('adminToken');
    if (!token) { alert('You are not authenticated. Please log in.'); location.href = 'index.html'; return; }

    const params = new URLSearchParams(location.search);
    const newsId = params.get('id');
    if (!newsId) { alert('Missing news id in URL.'); return; }

    const form = document.getElementById('editNewsForm');
    const imgInput = form.querySelector('input[name="photo"]');
    const imgPrev  = document.getElementById('newsImageDisplay');

    let originalPhotoUrl = '';

    // معاينة صورة جديدة
    imgInput.addEventListener('change', e => {
      const f = e.target.files[0];
      imgPrev.src = f ? URL.createObjectURL(f) : (originalPhotoUrl || '');
    });

    // جلب الخبر
    try {
      const res = await fetch(`http://localhost:3000/news/${newsId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error(`Failed to fetch news (HTTP ${res.status})`);
      const payload = await res.json();
      const n = payload.data || payload; // دعم الشكلين

      form.elements['news_id'].value = n.id || newsId;
      form.elements['title'].value = n.news_title || '';
      form.elements['description'].value = n.description || '';
      originalPhotoUrl = n.photo || '';
      imgPrev.src = originalPhotoUrl || '';
      imgPrev.alt = n.news_title || 'News image';
    } catch (err) {
      console.error(err);
      alert('Error loading news: ' + err.message);
    }

    // جعل الدالة في النطاق العام للزر
    window.handleNewsUpdate = async function () {
      const fd = new FormData(form);

      // تحويل title -> news_title
      if (fd.has('title')) {
        fd.set('news_title', fd.get('title'));
        fd.delete('title');
      }
      // لا نرسل news_id حقلًا في الجسم (المسار يكفي)
      fd.delete('news_id');

      // لو لم يختَر المستخدم صورة جديدة، احذف حقل photo كي لا يراها Multer فارغة
      if (!imgInput.files.length) fd.delete('photo');

      console.log('--- FormData (PUT /news/:id) ---');
      for (const [k,v] of fd.entries()) console.log(k, v);
      console.log('--------------------------------');

      try {
        const res = await fetch(`http://localhost:3000/news/${newsId}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` },
          body: fd
        });

        if (res.ok) {
          alert('News updated successfully!');
          location.href = 'news.html';
          return;
        }

        const ct = res.headers.get('content-type') || '';
        const errBody = ct.includes('application/json') ? await res.json() : await res.text();
        let msg = `Failed to update news (HTTP ${res.status}).`;
        if (typeof errBody === 'string') msg += `\n\n${errBody.slice(0,500)}…`;
        else if (errBody?.message) msg += `\n${Array.isArray(errBody.message) ? errBody.message.join('\n- ') : errBody.message}`;
        else msg += `\n${JSON.stringify(errBody)}`;
        alert(msg);
        console.error('Server error response:', errBody);
      } catch (e) {
        console.error('Update failed:', e);
        alert('Update failed: ' + e.message);
      }
    }
  });
  </script>
